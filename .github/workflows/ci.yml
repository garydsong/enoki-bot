name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # This step is load-bearing: it enforces the domain/ purity boundary.
      # Do not add `continue-on-error` to it.
      - name: Lint (includes architecture boundary rules)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (real Postgres)
        run: npm run test:integration

      - name: Architecture tests
        run: npm run test:arch

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build
